[package]
name = "exportsnap"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "TUI and CLI that repairs and exports a Snapchat data dump"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
ratatui = "0.30.2"
