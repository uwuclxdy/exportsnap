[package]
name = "exportsnap"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "TUI that repairs a Snapchat data export: real capture dates, merged captions, media filed by conversation"
repository = "https://github.com/uwuclxdy/exportsnap"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.5"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
directories = "6.0.0"
fs4 = "1.1.0"
# `webp`: 9 of the 162 overlays in the observed export carry WebP payloads under a `.png` name
# (measured 2026-08-04, header bytes only; see docs/design.md's local-fix section), and the
# decoder guesses from magic bytes rather than the extension, so the feature is what lets the
# image leg composite those pairs instead of failing them at decode.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
little_exif = "0.6.23"
mp4ameta = "0.13.0"
ratatui = "0.30.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
tzf-rs = { version = "1.3.7", default-features = false, features = ["bundled"] }
which = "8.0.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"
